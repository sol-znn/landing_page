<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>zenoglyphs</title>
    <meta name="description" content="chmod -w, forever." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='%23141414'/><g fill='none' stroke='%2367E646' stroke-width='2.6' stroke-linecap='square' stroke-linejoin='miter'><path d='M5.3,5.3H18.7L5.3,18.7H18.7'/><path d='M9.6,9.6L14.4,14.4'/></g></svg>" />

    <canvas id="bg" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <main class="stage">
      <h1 class="logo">
        <!-- The href is where the jump lands. It is an ordinary link first, so
             it still goes there with scripts off, from the keyboard, or in a
             new tab; main.ts only gets in the way of a plain click. -->
        <a id="jump" class="jump" href="https://zenoglyphs.zenon.foo" aria-label="zenoglyphs">
          <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square" stroke-linejoin="miter">
              <path d="M5.3,5.3H18.7L5.3,18.7H18.7" />
              <path d="M9.6,9.6L14.4,14.4" />
            </g>
          </svg>
        </a>
      </h1>
      <a class="github" href="https://github.com/sol-znn" target="_blank" rel="noreferrer" aria-label="GitHub">
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path
            fill="currentColor"
            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38
               0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13
               -.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66
               .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
               -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
               .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12
               .51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48
               0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"
          />
        </svg>
      </a>
    </main>

    <footer id="foot" class="foot">
      <a class="footlink" href="https://zenoglyphs.zenon.foo">
        <span id="netName"></span>
        <span id="netTag"></span>
      </a>
    </footer>

    <div class="jump-flash" aria-hidden="true"></div>

    <button id="scene" class="motion-toggle scene-toggle" type="button" aria-pressed="false" aria-label="Calm wave" title="Calm wave"></button>
    <button id="motion" class="motion-toggle" type="button" aria-pressed="false" aria-label="Stop motion" title="Stop motion"></button>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
