# Build the landing page and publish it to GitHub Pages.
#
# There is nothing secret in this bundle -- no wallet, no RPC endpoint, no
# per-deploy config -- so the whole workflow is just: build, then publish
# dist/. The one thing that varies by where it's hosted is the asset path
# prefix, handled the same way zenon-faucet's deploy does.
#
# One-time setup:
#   1. Settings -> Pages -> Source: GitHub Actions
#   2. Settings -> Pages -> Custom domain: zenon.foo
#
# Optional, only if the custom domain is ever dropped:
#   Settings -> Secrets and variables -> Actions -> Variables
#     LANDING_BASE_PATH   "/<repo>/" -- see the note on the build step below.

name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run in progress finish rather than cancelling it: a half-deployed
# page is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Build
        env:
          # This site is served from a custom domain (zenon.foo) at the root,
          # so asset URLs take no prefix.
          #
          # The default used to be /<repo>/, copied from zenon-faucet's deploy,
          # on the theory that a repository variable would override it for the
          # custom domain. That is backwards for a site that only ever deploys
          # to that domain: when the variable is not set -- which is the state
          # a fresh clone, a forked repo, or a settings reset lands in -- the
          # build silently emits /landing_page/assets/... , every one of which
          # 404s at the domain root. Nothing errors; the page just loads with
          # no stylesheet, which renders as a white background with a black
          # logo. Defaulting to the path that is actually correct here means
          # the failure mode is a missing override, not a silent misbuild.
          LANDING_BASE_PATH: ${{ vars.LANDING_BASE_PATH || '/' }}
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
